name: MultiplexMobile
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.101.2
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: 0.13.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 4.5.0
targets:
  MultiplexMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MultiplexMobileUITests
    dependencies:
      - target: MultiplexMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multiplex.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
  MultiplexMobile:
    type: application
    platform: iOS
    sources:
      - MultiplexMobile/App/MultiplexMobileApp.swift
      - MultiplexMobile/Assets.xcassets
      - MultiplexMobile/Controller
      - MultiplexMobile/Enrollment
      - MultiplexMobile/ReplicationTransport
      - MultiplexMobile/Generated/MultiplexControllerSecurity.swift
      - MultiplexMobile/Generated/MultiplexRemoteScreens.swift
      - Replication/Sources/MultiplexReplicationSecurity.swift
      - MultiplexMobile/Security/ReplicationKeychainStore.swift
      - MultiplexMobile/Models/ControllerModels.swift
      - MultiplexMobile/Models/ControllerRemoteRoute.swift
      - MultiplexMobile/Models/ControllerRemoteRouteConfiguration.swift
      - MultiplexMobile/Models/MobileRouteContract.swift
      - MultiplexMobile/Models/MobileCrossRouteAcceptance.swift
      - MultiplexMobile/Models/MobileVaultModels.swift
      - MultiplexMobile/Relay/RelayControllerTransport.swift
      - MultiplexMobile/Security/ControllerKeychainBlobStore.swift
      - MultiplexMobile/Security/ControllerRouteConfigurationStore.swift
      - MultiplexMobile/Security/ControllerRouteCredentialStore.swift
      - MultiplexMobile/Security/KeychainSecretStore.swift
      - MultiplexMobile/Security/MobileDeviceIdentityStore.swift
      - MultiplexMobile/SSH/MobileSSHSession.swift
      - MultiplexMobile/SSH/OpenSSHPrivateKeyParser.swift
      - MultiplexMobile/SSH/SSHControllerTransport.swift
      - MultiplexMobile/SSH/TmuxBootstrap.swift
      - MultiplexMobile/Terminal/BoundedTerminalBuffer.swift
      - MultiplexMobile/Terminal/GeneratedTerminalCellWidth.swift
      - MultiplexMobile/Terminal/NativeControllerTerminal.swift
      - MultiplexMobile/Terminal/TerminalInteraction.swift
      - MultiplexMobile/Terminal/TerminalAcceptance.swift
      - MultiplexMobile/Terminal/TerminalBuffer.swift
      - MultiplexMobile/Terminal/TerminalGrid.swift
      - MultiplexMobile/Terminal/TerminalInputEncoding.swift
      - MultiplexMobile/ViewModels/ControllerScreenCoordinator.swift
      - MultiplexMobile/ViewModels/ControllerTerminalViewModel.swift
      - MultiplexMobile/ViewModels/ControllerViewModel.swift
      - MultiplexMobile/ViewModels/HostListViewModel.swift
      - MultiplexMobile/ViewModels/RemoteScreenViewModel.swift
      - MultiplexMobile/Vault
      - MultiplexMobile/Views/ContentView.swift
      - MultiplexMobile/Views/RemoteScreenView.swift
      - MultiplexMobile/Views/ControllerPresentation.swift
      - MultiplexMobile/Views/ControllerQRCodeScanner.swift
      - MultiplexMobile/Views/ControllerReadOnlyTerminalView.swift
      - MultiplexMobile/Views/ControllerRootView.swift
      - MultiplexMobile/Views/ControllerTerminalInputView.swift
      - MultiplexMobile/Views/HostListView.swift
      - MultiplexMobile/Views/SlateColors.swift
      - MultiplexMobile/Views/SlateTokens.swift
      - MultiplexMobile/Views/TerminalSessionView.swift
      - MultiplexMobile/Localizable.xcstrings
    dependencies:
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-crypto
        product: Crypto
      - framework: Frameworks/MultiplexMobileCrypto.xcframework
        embed: false
      - framework: Frameworks/MultiplexControllerSecurity.xcframework
        embed: false
      - framework: Frameworks/MultiplexRemoteScreens.xcframework
        embed: false
      # The Remote Screens library decodes and encodes video through VideoToolbox, which reaches
      # the linker as undefined symbols unless the frameworks behind them are named here: a static
      # library carries no record of what it expects to be linked against.
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - framework: Replication/MultiplexReplicationSecurity.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multiplex.mobile
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MultiplexMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Multiplex finds Multiplex desktops on your local network and connects to the ones you pair.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a Multiplex Desktop pairing code without saving camera images.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        UNIFIED_MOBILE_ROUTES: 1
  MultiplexMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MultiplexMobileTests/BoundedTerminalBufferTests.swift
      - MultiplexMobileTests/AppleControllerRouteTests.swift
      - MultiplexMobileTests/AppleControllerRouteViewModelTests.swift
      - MultiplexMobileTests/AppleSSHControllerTransportLiveTests.swift
      - MultiplexMobileTests/AppleRelayControllerTransportLiveTests.swift
      - MultiplexMobileTests/ControllerBindingConformanceTests.swift
      - MultiplexMobileTests/ControllerScreenSessionTests.swift
      - MultiplexMobileTests/RemoteScreenViewModelTests.swift
      - MultiplexMobileTests/ReplicationCustodyTests.swift
      - MultiplexMobileTests/EnrollmentWorkflowTests.swift
      - MultiplexMobileTests/ReplicationDocumentReaderTests.swift
      - MultiplexMobileTests/ControllerFleetCacheTests.swift
      - MultiplexMobileTests/ControllerPairingFleetTests.swift
      - MultiplexMobileTests/ControllerReadOnlyTerminalTests.swift
      - MultiplexMobileTests/ControllerTerminalViewModelTests.swift
      - MultiplexMobileTests/ControllerWriterTests.swift
      - MultiplexMobileTests/TerminalConformanceV1Tests.swift
      - MultiplexMobileTests/TerminalConformanceV2Tests.swift
      - MultiplexMobileTests/TerminalInteractionTests.swift
      - MultiplexMobileTests/TerminalAcceptanceTests.swift
      - MultiplexMobileTests/MobileRouteContractTests.swift
      - MultiplexMobileTests/MobileCrossRouteAcceptanceTests.swift
      - MultiplexMobileTests/MobileVaultImporterTests.swift
      - MultiplexMobileTests/UnifiedRouteLifecycleTests.swift
      - MultiplexMobileTests/DirectSSHIntegrationTests.swift
      - MultiplexMobileTests/UniversalSessionGoldenPathTests.swift
      - path: MultiplexMobileTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MultiplexMobile
      - package: swift-nio-ssh
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multiplex.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
