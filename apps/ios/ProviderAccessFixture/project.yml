name: ProviderAccessFixture
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  C06Documents:
    type: application
    platform: iOS
    sources: [Donor]
    info:
      path: Donor/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termirust.fixture.documents
  ProviderReader:
    type: application
    platform: iOS
    sources:
      - Reader
      - ../TermiRustMobile/ReplicationTransport/ReplicationDocumentReader.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termirust.fixture.reader
  ProviderPickerTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ProviderReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termirust.fixture.picker-tests
        TEST_TARGET_NAME: ProviderReader
schemes:
  ProviderReader:
    build:
      targets:
        ProviderReader: all
        C06Documents: all
        ProviderPickerTests: [test]
    test:
      targets: [ProviderPickerTests]
