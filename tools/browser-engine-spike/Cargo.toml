[package]
name = "termirust-browser-engine-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[features]
default = []
chromiumoxide-candidate = ["dep:chromiumoxide"]
headless-chrome-candidate = ["dep:headless_chrome"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# These exact optional pins keep the candidate dependency graphs reviewable
# without adding either controller to the production workspace.
chromiumoxide = { version = "=0.9.1", default-features = false, optional = true }
headless_chrome = { version = "=1.0.22", default-features = false, optional = true }

[[bin]]
name = "browser-engine-spike"
path = "src/main.rs"
