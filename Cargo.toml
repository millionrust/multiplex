[package]
name = "termirust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
gpui = "0.2.2"
gpui-component = "0.5.1"
rfd = "0.15"
russh = { version = "0.57", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-util", "rt", "sync"] }
vt100 = "0.16.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
