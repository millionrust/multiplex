# Virtual workspace manifest. The desktop application lives in
# crates/termirust-desktop and is the default member, so `cargo run`,
# `cargo check`, and `cargo test` from the repository root keep targeting it.

[workspace]
resolver = "3"
default-members = ["crates/termirust-desktop"]
members = [
    "crates/termirust-accessibility-macos",
    "crates/termirust-browser",
    "crates/termirust-cli",
    "crates/termirust-client",
    "crates/termirust-controller-bindings",
    "crates/termirust-controller-listener",
    "crates/termirust-controller-security",
    "crates/termirust-desktop",
    "crates/termirust-diagnostics",
    "crates/termirust-domain",
    "crates/termirust-host-protocol",
    "crates/termirust-mcp",
    "crates/termirust-mobile-ffi",
    "crates/termirust-protocol",
    "crates/termirust-relay-client",
    "crates/termirust-relay-protocol",
    "crates/termirust-relay-server",
    "crates/termirust-replication-bindings",
    "crates/termirust-replication-security",
    "crates/termirust-session-host",
    "crates/termirust-slate",
    "crates/termirust-store",
    "crates/termirust-tui",
    "crates/termirust-ui-contract",
    "crates/termirust-update-trust",
]
# Standalone spike workspaces with their own lockfiles and policy files.
exclude = [
    "tools/browser-engine-spike",
    "tools/relay-spike",
]

[workspace.package]
version = "0.1.0"
# The locked all-target dependency graph requires Rust 1.88. Development and
# CI use the newer pinned toolchain declared in rust-toolchain.toml.
rust-version = "1.88"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
