[package]
name = "termirust"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm-siv = "0.11"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
dirs = "6.0"
gpui = "0.2.2"
gpui-component = "0.5.1"
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
portable-pty = "0.9"
rand = "0.8"
rfd = "0.15"
russh = { version = "0.57", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
vt100 = "0.16.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
