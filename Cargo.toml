[package]
name = "termirust"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Native desktop SSH client built with GPUI"
authors = ["TermiRust contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jacobsam/terminal"
readme = "README.md"
default-run = "termirust"

[workspace]
members = [
    "crates/termirust-client",
    "crates/termirust-domain",
    "crates/termirust-host-protocol",
    "crates/termirust-session-host",
    "crates/termirust-mobile-ffi",
    "crates/termirust-protocol",
    "crates/termirust-store",
    "crates/termirust-ui-contract",
]
resolver = "3"

[workspace.package]
# The locked all-target dependency graph requires Rust 1.88. Development and
# CI use the newer pinned toolchain declared in rust-toolchain.toml.
rust-version = "1.88"

[package.metadata.bundle]
name = "TermiRust"
identifier = "com.termirust.desktop"
icon = ["assets/icons/app.png", "assets/icons/app@2x.png"]
copyright = "Copyright (c) 2025 TermiRust contributors"
category = "DeveloperTool"
short_description = "Native desktop SSH client"
long_description = """
TermiRust is a native desktop SSH client with vault management,
SFTP browsing, port forwarding, jump host chains, snippets,
broadcast input, and more.
"""
osx_minimum_system_version = "12.0"
osx_url_schemes = ["termirust"]
deb_depends = ["libssl3", "libxkbcommon0"]

[dependencies]
aes-gcm-siv = "0.11"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
dirs = "6.0"
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
gpui-component = "0.5.1"
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
libc = "0.2"
portable-pty = "0.9"
rand = "0.8"
rfd = "0.15"
russh = { version = "0.57", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
termirust-protocol = { version = "0.1.0", path = "crates/termirust-protocol" }
termirust-domain = { version = "0.1.0", path = "crates/termirust-domain" }
termirust-client = { version = "0.1.0", path = "crates/termirust-client" }
termirust-host-protocol = { version = "0.1.0", path = "crates/termirust-host-protocol" }
termirust-session-host = { version = "0.1.0", path = "crates/termirust-session-host" }
termirust-store = { version = "0.1.0", path = "crates/termirust-store" }
termirust-ui-contract = { version = "0.1.0", path = "crates/termirust-ui-contract" }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
vt100 = "0.16.2"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
objc = "0.2"

[dev-dependencies]
tempfile = "3.27"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
