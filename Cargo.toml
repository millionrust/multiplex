# Virtual workspace manifest. The desktop application lives in
# crates/multiplex-desktop and is the default member, so `cargo run`,
# `cargo check`, and `cargo test` from the repository root keep targeting it.

[workspace]
resolver = "3"
default-members = ["crates/multiplex-desktop"]
members = [
    "crates/multiplex-accessibility-macos",
    "crates/multiplex-browser",
    "crates/multiplex-cli",
    "crates/multiplex-client",
    "crates/multiplex-controller-bindings",
    "crates/multiplex-controller-listener",
    "crates/multiplex-controller-security",
    "crates/multiplex-desktop",
    "crates/multiplex-diagnostics",
    "crates/multiplex-domain",
    "crates/multiplex-env",
    "crates/multiplex-host-protocol",
    "crates/multiplex-mcp",
    "crates/multiplex-mobile-ffi",
    "crates/multiplex-protocol",
    "crates/multiplex-relay-client",
    "crates/multiplex-relay-protocol",
    "crates/multiplex-relay-server",
    "crates/multiplex-replication-bindings",
    "crates/multiplex-replication-security",
    "crates/multiplex-screen-bindings",
    "crates/multiplex-screen-capture",
    "crates/multiplex-screen-codec",
    "crates/multiplex-screen-host",
    "crates/multiplex-screen-input",
    "crates/multiplex-screen-protocol",
    "crates/multiplex-screen-session",
    "crates/multiplex-screen-transport",
    "crates/multiplex-screen-video",
    "crates/multiplex-session-host",
    "crates/multiplex-slate",
    "crates/multiplex-store",
    "crates/multiplex-tmux",
    "crates/multiplex-tui",
    "crates/multiplex-ui-contract",
    "crates/multiplex-update-trust",
]
# Standalone spike workspaces with their own lockfiles and policy files.
exclude = [
    "tools/browser-engine-spike",
    "tools/iroh-transport-spike",
    "tools/relay-spike",
    "tools/videotoolbox-spike",
]

[workspace.package]
version = "0.1.0"
# The locked all-target dependency graph requires Rust 1.88. Development and
# CI use the newer pinned toolchain declared in rust-toolchain.toml.
rust-version = "1.88"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
