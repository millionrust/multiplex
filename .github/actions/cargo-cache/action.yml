name: Cargo compiler cache
description: Set up pinned mr-boxington and route existing Cargo scripts through its shim.
inputs:
  backend:
    description: GitHub transport for trusted CI and shipping builds; local reuse for offline builds.
    default: github
  generation:
    description: Separate compiler cache namespace for this build configuration.
    default: multiplex-ci-v1
  mode:
    description: Target payload for normal builds, objects for isolated mobile targets.
    default: target
  cache-links:
    description: Cache eligible native links in objects mode; auto enables them on Linux.
    default: auto
  save-on-workflow-dispatch:
    description: Allow trusted manual builds to populate their own cache namespace.
    default: "false"
runs:
  using: composite
  steps:
    - name: Restore Cargo compiler work
      uses: jdx/mr-boxington-action@969741d4490229c48bdff982a720e45e0bd1de6c # v1
      with:
        version: 1.29.0
        toolchain: 1.98.1
        backend: ${{ inputs.backend }}
        cache-generation: ${{ inputs.generation }}
        github-cache-mode: ${{ inputs.mode }}
        cache-links: ${{ inputs.cache-links }}
        save-on-workflow-dispatch: ${{ inputs.save-on-workflow-dispatch }}
    - name: Enable the Cargo shim for build and verification scripts
      shell: bash
      run: |
        mbx setup --yes
        node <<'JS'
        const fs = require('node:fs');
        const os = require('node:os');
        const path = require('node:path');
        const dataDirectory = process.platform === 'win32'
          ? process.env.LOCALAPPDATA
          : process.platform === 'darwin'
            ? path.join(os.homedir(), 'Library', 'Application Support')
            : process.env.XDG_DATA_HOME || path.join(os.homedir(), '.local', 'share');
        if (!dataDirectory) throw new Error('Cannot find the Cargo shim data directory');
        const shimDirectory = path.join(dataDirectory, 'mbx', 'bin');
        const shim = path.join(shimDirectory, process.platform === 'win32' ? 'cargo.exe' : 'cargo');
        if (!fs.existsSync(shim)) throw new Error('mr-boxington did not install its Cargo shim');
        fs.appendFileSync(process.env.GITHUB_PATH, `${shimDirectory}\n`);
        // Packaging expects target/<triple>/release; mobile scripts select their own targets.
        fs.appendFileSync(process.env.GITHUB_ENV, 'MBX_TARGET_VIEWS=0\n');
        JS
    - name: Verify compiler cache setup
      shell: bash
      run: |
        mbx setup --status
        mbx doctor
