name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under (e.g. v0.0.5). Leave blank to dry-run without publishing."
        required: false
        default: ""

# A dry run (dispatched without a tag) only proves that everything builds, so it compiles in
# parallel without link-time optimisation. Anything that is published gets the release profile as
# Cargo.toml declares it: one codegen unit and thin LTO, the slowest to build and fastest to run.
env:
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && '1' || '16' }}
  CARGO_PROFILE_RELEASE_LTO: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && 'thin' || 'false' }}

permissions:
  contents: write
  actions: read
  attestations: write
  id-token: write

jobs:
  build:
    name: build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macos-aarch64
            runner: macos-26
            triple: aarch64-apple-darwin
            bundle: macos
          # Cross-compiled on Apple silicon: ScreenCaptureKit's Metal bridge needs a newer SDK
          # than the Intel runner image's Xcode carries.
          - name: macos-x86_64
            runner: macos-26
            triple: x86_64-apple-darwin
            bundle: macos
          # 24.04, as CI: 22.04's PipeWire 0.3.48 is older than the libspa bindings expect.
          - name: linux-x86_64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            bundle: linux
          - name: windows-x86_64
            runner: windows-2022
            triple: x86_64-pc-windows-msvc
            bundle: windows
            msi_arch: x64
          # Windows on Arm, built natively on GitHub's Arm runner.
          - name: windows-aarch64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
            bundle: windows
            msi_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target.triple }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target.name }}
          # Releases are rare; their gigabytes of cache would only evict what CI reuses every push.
          save-if: false

      - name: Linux build dependencies
        if: matrix.target.bundle == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libfontconfig1-dev libdbus-1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pkg-config

      - name: Build release application and sidecars
        run: >-
          cargo build --release --target ${{ matrix.target.triple }} --locked
          -p multiplex
          -p multiplex-cli
          -p multiplex-session-host
          -p multiplex-mcp
          -p multiplex-relay-server

      - name: Install cargo-bundle (macOS)
        if: matrix.target.bundle == 'macos'
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Bundle macOS .app
        if: matrix.target.bundle == 'macos'
        run: |
          (cd crates/multiplex-desktop && cargo bundle --release --target ${{ matrix.target.triple }})
          mkdir -p dist
          APP="target/${{ matrix.target.triple }}/release/bundle/osx/Multiplex.app"
          test -d "$APP/Contents/MacOS"
          for name in multiplex-cli multiplex-session-host multiplex-mcp multiplex-mcp-authorize multiplex-relay; do
            install -m 755 "target/${{ matrix.target.triple }}/release/$name" "$APP/Contents/MacOS/$name"
          done
          ./scripts/verify/release-package.sh "$APP/Contents/MacOS"
          ditto -c -k --keepParent "$APP" "dist/Multiplex-${{ matrix.target.name }}.zip"
          # From inside dist/, so the file names only the download and `shasum -c` works beside it.
          (cd dist && shasum -a 256 "Multiplex-${{ matrix.target.name }}.zip" > "Multiplex-${{ matrix.target.name }}.zip.sha256")

      - name: Bundle Linux deb and portable archive
        if: matrix.target.bundle == 'linux'
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target.triple }}/release"
          PORTABLE="dist/Multiplex-${{ matrix.target.name }}"
          mkdir -p "$PORTABLE"
          for name in multiplex multiplex-cli multiplex-session-host multiplex-mcp multiplex-mcp-authorize multiplex-relay; do
            install -m 755 "$BIN/$name" "$PORTABLE/$name"
          done
          ./scripts/verify/release-package.sh "$PORTABLE"
          tar -C dist -czf "dist/Multiplex-${{ matrix.target.name }}.tar.gz" "Multiplex-${{ matrix.target.name }}"

          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          ROOT="dist/deb-root"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/applications" "$ROOT/usr/share/icons/hicolor/512x512/apps"
          install -m 755 "$PORTABLE"/* "$ROOT/usr/bin/"
          install -m 644 crates/multiplex-desktop/assets/icons/app.png "$ROOT/usr/share/icons/hicolor/512x512/apps/multiplex.png"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Multiplex' 'Exec=multiplex' 'Icon=multiplex' 'Categories=Development;Utility;' 'Terminal=false' > "$ROOT/usr/share/applications/multiplex.desktop"
          printf 'Package: multiplex\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: Multiplex contributors\nDepends: libssl3t64 | libssl3, libxkbcommon0, libxkbcommon-x11-0, libpipewire-0.3-0t64 | libpipewire-0.3-0\nDescription: Native desktop SSH client\n' "$VERSION" > "$ROOT/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$ROOT" "dist/multiplex_${VERSION}_amd64.deb"
          (cd dist && sha256sum "Multiplex-${{ matrix.target.name }}.tar.gz" "multiplex_${VERSION}_amd64.deb" > "Multiplex-${{ matrix.target.name }}.sha256")
          rm -rf "$PORTABLE" "$ROOT"

      - name: Package Windows artifact
        if: matrix.target.bundle == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "dist/Multiplex-${{ matrix.target.name }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $required = @(
            "multiplex.exe",
            "multiplex-cli.exe",
            "multiplex-session-host.exe",
            "multiplex-mcp.exe",
            "multiplex-mcp-authorize.exe",
            "multiplex-relay.exe"
          )
          foreach ($name in $required) {
            $source = Join-Path "target/${{ matrix.target.triple }}/release" $name
            if (-not (Test-Path -PathType Leaf $source)) {
              throw "required Windows release executable is missing: $source"
            }
            Copy-Item $source $stage
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Multiplex-${{ matrix.target.name }}.zip"
          $hash = (Get-FileHash "dist/Multiplex-${{ matrix.target.name }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          # LF, not Set-Content's CRLF: `shasum -c` on macOS and Linux would read the carriage
          # return as part of the file name.
          [IO.File]::WriteAllText("dist/Multiplex-${{ matrix.target.name }}.zip.sha256", "$hash  Multiplex-${{ matrix.target.name }}.zip`n")

      # WiX 5, pinned: a .NET tool, so it runs on the Arm runner too, and older than the releases
      # that ask for a maintenance-fee EULA.
      - name: .NET for WiX
        if: matrix.target.bundle == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX
        if: matrix.target.bundle == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      # The per-user installer, from the same programs as the zip. crates/multiplex-desktop/wix
      # explains its choices.
      - name: Build the Windows installer
        if: matrix.target.bundle == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $stage = (Resolve-Path "dist/Multiplex-${{ matrix.target.name }}").Path
          $msi = "dist/Multiplex-${{ matrix.target.name }}.msi"
          wix build crates/multiplex-desktop/wix/multiplex.wxs -arch ${{ matrix.target.msi_arch }} -d "Version=$version" -d "SourceDir=$stage" -o $msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$msi.sha256", "$hash  Multiplex-${{ matrix.target.name }}.msi`n")
          Remove-Item -Recurse -Force $stage
          Remove-Item -Force "dist/*.wixpdb" -ErrorAction SilentlyContinue

      # The installer is only shipped after this runner has installed and removed it, silently, as
      # the user it runs as: the programs must land in the per-user folder, and leave it again.
      - name: Install and remove the installer on this runner
        if: matrix.target.bundle == 'windows'
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist/Multiplex-${{ matrix.target.name }}.msi").Path
          $folder = Join-Path $env:LOCALAPPDATA "Programs\Multiplex"
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60; throw "install failed: $($install.ExitCode)" }
          foreach ($name in @("multiplex.exe", "multiplex-cli.exe", "multiplex-session-host.exe", "multiplex-mcp.exe", "multiplex-mcp-authorize.exe", "multiplex-relay.exe")) {
            if (-not (Test-Path (Join-Path $folder $name))) { throw "not installed: $name" }
          }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Multiplex.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut missing" }
          $remove = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\remove.log`"" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\remove.log" -Tail 60; throw "uninstall failed: $($remove.ExitCode)" }
          if (Test-Path (Join-Path $folder "multiplex.exe")) { throw "uninstall left the programs behind" }
          if (Test-Path $shortcut) { throw "uninstall left the Start menu shortcut" }
          Write-Host "The installer installed and removed Multiplex cleanly."

      - name: Generate platform SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/Multiplex-${{ matrix.target.name }}.spdx.json
          artifact-name: Multiplex-${{ matrix.target.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      # The two macOS builds are only inputs to the universal app, so their artifacts are named
      # apart from what the release collects.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.bundle == 'macos' && 'macos-slice' || 'multiplex' }}-${{ matrix.target.name }}
          path: dist/*
          if-no-files-found: error

  # One Multiplex.app for every Mac: each executable from the two builds above merged with lipo.
  macos-universal:
    name: build (macos-universal)
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Download both macOS builds
        uses: actions/download-artifact@v4
        with:
          pattern: macos-slice-*
          path: slices

      - name: Merge them into one universal app
        run: |
          mkdir -p dist
          scripts/build/macos-universal.sh \
            slices/macos-slice-macos-aarch64/Multiplex-macos-aarch64.zip \
            slices/macos-slice-macos-x86_64/Multiplex-macos-x86_64.zip \
            dist/Multiplex-macos-universal.zip
          (cd dist && shasum -a 256 Multiplex-macos-universal.zip > Multiplex-macos-universal.zip.sha256)

      - name: Generate platform SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/Multiplex-macos-universal.spdx.json
          artifact-name: Multiplex-macos-universal.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiplex-macos-universal
          path: dist/*
          if-no-files-found: error

  android:
    name: build (android)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android
          # Releases are rare; their gigabytes of cache would only evict what CI reuses every push.
          save-if: false

      # The bindings scripts pin this NDK. The runner image carries a different default, so the
      # pinned one is installed and named explicitly.
      - name: Install the pinned Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Build and sync the generated bindings and native libraries
        # The NDK and Rust are pinned above; anything else the runner image differs on warns.
        env:
          MULTIPLEX_SCREEN_BINDINGS_ALLOW_UNPINNED: "1"
          MULTIPLEX_CONTROLLER_BINDINGS_ALLOW_UNPINNED: "1"
          MULTIPLEX_REPLICATION_ARTIFACTS_ALLOW_UNPINNED: "1"
        run: |
          scripts/build/mobile-controller-bindings.sh --android
          scripts/sync/mobile-controller-bindings.sh --write --android
          scripts/build/mobile-screen-bindings.sh --android
          scripts/sync/mobile-screen-bindings.sh --write --android
          scripts/sync/mobile-ffi-artifacts.sh android
          python3 scripts/build/mobile-replication-artifacts.py build --android
          python3 scripts/build/mobile-replication-artifacts.py sync --android --write

      # Signed with the debug key Gradle generates on this runner (see build.gradle.kts): the APK
      # installs by sideloading, but is not a Play Store build.
      - name: Build the release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          apps/android/gradlew -p apps/android assembleRelease --console=plain
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p release-out
          cp apps/android/app/build/outputs/apk/release/app-release.apk "release-out/Multiplex-${VERSION}-android.apk"
          (cd release-out && sha256sum "Multiplex-${VERSION}-android.apk" > "Multiplex-${VERSION}-android.apk.sha256")

      # Not dist/: the mobile build scripts write their intermediate frameworks and libraries under
      # dist/mobile, and uploading those alongside the package broke the release's flat file list.
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-out/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiplex-android
          path: release-out/*
          if-no-files-found: error

  ios:
    name: build (ios)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-ios
          # Releases are rare; their gigabytes of cache would only evict what CI reuses every push.
          save-if: false

      - name: Build and sync the generated bindings and frameworks
        # The hosted runner ships whatever Xcode its image has, not necessarily the pinned one.
        env:
          MULTIPLEX_SCREEN_BINDINGS_ALLOW_UNPINNED: "1"
          MULTIPLEX_CONTROLLER_BINDINGS_ALLOW_UNPINNED: "1"
        run: |
          scripts/build/mobile-controller-bindings.sh --ios
          scripts/sync/mobile-controller-bindings.sh --write --ios
          scripts/build/mobile-screen-bindings.sh --ios
          scripts/sync/mobile-screen-bindings.sh --write --ios
          scripts/sync/mobile-ffi-artifacts.sh ios
          python3 scripts/build/ios-replication-artifacts.py build
          python3 scripts/build/ios-replication-artifacts.py sync --write

      # No Apple signing identity exists yet, so this is an unsigned device build. It installs only
      # after being re-signed (for example by a sideloading tool with the user's own Apple ID).
      - name: Build the unsigned iOS application
        run: |
          cd apps/ios
          xcodegen generate --spec project.yml
          xcodebuild archive -quiet \
            -project MultiplexMobile.xcodeproj \
            -scheme MultiplexMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MultiplexMobile.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cd "$GITHUB_WORKSPACE"
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          STAGE="$RUNNER_TEMP/ipa"
          mkdir -p "$STAGE/Payload" release-out
          APP=$(find "$RUNNER_TEMP/MultiplexMobile.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)
          test -d "$APP"
          ditto "$APP" "$STAGE/Payload/$(basename "$APP")"
          (cd "$STAGE" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/release-out/Multiplex-${VERSION}-ios-unsigned.ipa")
          (cd release-out && shasum -a 256 "Multiplex-${VERSION}-ios-unsigned.ipa" > "Multiplex-${VERSION}-ios-unsigned.ipa.sha256")

      # Not dist/: the mobile build scripts write their intermediate frameworks and libraries under
      # dist/mobile, and uploading those alongside the package broke the release's flat file list.
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-out/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiplex-ios
          path: release-out/*
          if-no-files-found: error

  # Runs on a dry run too, so gathering every platform's files into one release is checked before
  # a tag depends on it; only the step that creates the GitHub release needs a tag.
  release:
    name: publish
    needs: [build, macos-universal, android, ios]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: multiplex-*
          path: dist

      - name: Flatten artifact directories
        run: |
          mkdir -p flat
          find dist -mindepth 2 -type f -exec cp -t flat {} +
          ls -la flat

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: flat/*
          # Always a draft: a person publishes it after looking at it. Early releases are unsigned
          # on every platform (macOS is not notarized, Windows has no Authenticode signature, the
          # APK carries a throwaway debug key, and the iOS build must be re-signed to install).
          draft: true
          prerelease: true
