name: ci

permissions:
  contents: read

on:
  push:
    branches: [main, dev, test]
  pull_request:
  # Run by hand with `debug` on to be handed a shell on each runner, from the moment it starts.
  # Meant for a failure that cannot be read from a log: a linker that will not say which symbol it
  # wanted, a build script that panics inside a dependency, a toolchain unlike every machine here.
  # The session is detached, so a job that nobody connects to runs and finishes as it always does.
  workflow_dispatch:
    inputs:
      debug:
        description: "Open a shell on each runner for the length of the job"
        type: boolean
        default: false

jobs:
  test:
    name: rust baseline (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is deprecated and carries an Xcode far behind the one the iOS job builds
        # against; both macOS jobs now test the toolchain the applications are actually built on.
        runner: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detached, and before anything is built: the connection string is only readable in a live
      # log, so opening the session at the end of a failing job means racing it. This one is there
      # from the start and the job carries on around it, so the build can be watched as it runs.
      - name: Shell on the runner, from the start
        id: shell
        if: inputs.debug
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: true

      # A running job's log cannot be read through the API, so the address is published as an
      # annotation as well, which can. Whoever asked for the shell can then pick it up without
      # watching a browser for the moment it appears.
      - name: Publish the shell address
        if: inputs.debug
        run: |
          echo "::notice title=Runner shell (${{ matrix.runner }})::${{ steps.shell.outputs.ssh-command }}"
          echo "${{ steps.shell.outputs.ssh-command }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # CI has been red, and rust-cache saves nothing from a failed job by default, so every
          # run rebuilt the whole workspace from scratch.
          cache-on-failure: true

      # The MCP, browser and diagnostics gates search with ripgrep, which the runners lack.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8,ripgrep

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libfontconfig1-dev libdbus-1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pkg-config tmux

      - name: macOS tmux dependency
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null 2>&1 || brew install tmux

      - name: Verify generated design-token contract
        run: ./scripts/verify/design-tokens.sh --all-ui --no-new-baseline

      - name: Verify localization contract and copy policy
        run: ./scripts/verify/localization.sh --locales en-US,en-XA,ar-XB --no-new-baseline

      - name: Verify fail-closed release contract
        run: ./scripts/verify/release-workflow.sh

      - name: Verify Rust workspace
        env:
          TERMIRUST_CLIPPY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/verify/rust.sh workspace

      # tmux changes what it accepts between releases: 3.2a has no copy-mode position counter and
      # rewrites `:` and `.` in session names, so a setup that works on the newest tmux can still
      # break the one an LTS ships. Both ends are built here rather than taken from the image,
      # which ships neither: 22.04 gave us 3.2a for free, and this runner had to move to 24.04
      # because PipeWire 0.3.48 declares a format modifier signed where libspa expects it
      # unsigned, so the Linux capture backend cannot compile there at all.
      - name: Build the tmux versions to test against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libevent-dev libncurses-dev bison
          for version in 3.2a 3.5a; do
            curl -fsSL -o "/tmp/tmux-$version.tar.gz" \
              "https://github.com/tmux/tmux/releases/download/$version/tmux-$version.tar.gz"
            tar -xzf "/tmp/tmux-$version.tar.gz" -C /tmp
            (cd "/tmp/tmux-$version" \
              && ./configure --prefix="/opt/tmux-$version" >/dev/null \
              && make -j"$(nproc)" >/dev/null \
              && sudo make install >/dev/null)
          done

      - name: Behaviour across tmux versions
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            ./scripts/test/tmux-matrix.sh \
              /opt/tmux-3.2a/bin/tmux /usr/bin/tmux /opt/tmux-3.5a/bin/tmux
          else
            ./scripts/test/tmux-matrix.sh
          fi


      - name: Repeat local tmux regression
        run: ./scripts/test/repeat.sh 25 local::tests::local_tmux_session_survives_disconnect_and_reattaches

      - name: Repeat canvas tmux capability regression
        run: ./scripts/test/repeat.sh 25 ui::app::tests::canvas_persistent_local_terminal_opens_or_explains_missing_tmux

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          # CI has been red, and rust-cache saves nothing from a failed job by default, so every
          # run rebuilt the whole workspace from scratch.
          cache-on-failure: true

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libfontconfig1-dev libdbus-1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pkg-config

      - name: Check minimum supported Rust version
        # termirust-screen-transport is excluded from the all-features pass and checked on its
        # own below: its `iroh` feature is the Stage B QUIC route, off by default, and the QUIC
        # stack it pulls in needs Rust 1.91. The crate itself, as it ships, builds at the MSRV.
        run: |
          cargo +1.88.0 check --workspace --exclude termirust-slate \
            --exclude termirust-screen-transport --all-targets --all-features --locked
          cargo +1.88.0 check -p termirust-screen-transport --all-targets --locked

  windows:
    name: windows runtime and sidecars
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # CI has been red, and rust-cache saves nothing from a failed job by default, so every
          # run rebuilt the whole workspace from scratch.
          cache-on-failure: true

      - name: Compile and test Windows workspace
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast

      - name: Build required Windows release executables
        run: >-
          cargo build --release --locked
          -p termirust
          -p termirust-cli
          -p termirust-session-host
          -p termirust-mcp
          -p termirust-relay-server

      - name: Verify required Windows release executables
        shell: pwsh
        run: |
          $required = @(
            "termirust.exe",
            "termirust-cli.exe",
            "termirust-session-host.exe",
            "termirust-mcp.exe",
            "termirust-mcp-authorize.exe",
            "termirust-relay.exe"
          )
          foreach ($name in $required) {
            $path = Join-Path "target/release" $name
            if (-not (Test-Path -PathType Leaf $path)) {
              throw "required Windows release executable is missing: $path"
            }
          }

  android:
    name: native Android application
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Shell on the runner, from the start
        id: shell
        if: inputs.debug
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: true

      - name: Publish the shell address
        if: inputs.debug
        run: |
          echo "::notice title=Runner shell (Android)::${{ steps.shell.outputs.ssh-command }}"
          echo "${{ steps.shell.outputs.ssh-command }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          # CI has been red, and rust-cache saves nothing from a failed job by default, so every
          # run rebuilt the whole workspace from scratch.
          cache-on-failure: true

      # The Kotlin conformance tests call the generated bindings through JNA on the build
      # machine, so they need the host build of the library the APK packages for each ABI.
      - name: Build Controller bindings for Kotlin unit tests
        run: |
          cargo build --locked --release -p termirust-controller-bindings --lib
          mkdir -p apps/android/app/src/test/native/linux-x86-64
          cp target/release/libtermirust_controller_bindings.so apps/android/app/src/test/native/linux-x86-64/

      # The Remote Screens bindings are generated rather than vendored, and the Kotlin sources
      # name their types, so `compileDebugKotlin` needs them before anything else runs.
      - name: Build and sync Remote Screens bindings
        # A hosted runner does not get to choose its NDK, and these bindings are built to prove the
        # application compiles and its tests pass, not to be released. Release artifacts are built
        # on the pinned toolchains, where this variable is unset.
        env:
          TERMIRUST_SCREEN_BINDINGS_ALLOW_UNPINNED: "1"
        run: |
          scripts/build/mobile-screen-bindings.sh --android
          scripts/sync/mobile-screen-bindings.sh --write --android

      - name: Verify Kotlin contracts, unit tests, lint, and debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          apps/android/scripts/verify-android-unified-routes.sh
          apps/android/gradlew -p apps/android lintDebug --console=plain


  ios:
    name: native iOS and iPadOS application
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Shell on the runner, from the start
        id: shell
        if: inputs.debug
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: true

      - name: Publish the shell address
        if: inputs.debug
        run: |
          echo "::notice title=Runner shell (iOS)::${{ steps.shell.outputs.ssh-command }}"
          echo "${{ steps.shell.outputs.ssh-command }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The Xcode project lists the generated Remote Screens bindings among its sources, and they
      # are generated rather than vendored, so the project cannot even be generated without them.
      - name: Build and sync Remote Screens bindings
        # As on Android: the runner's Xcode is whatever the image ships, and what is built here is
        # verified, not shipped.
        env:
          TERMIRUST_SCREEN_BINDINGS_ALLOW_UNPINNED: "1"
        run: |
          scripts/build/mobile-screen-bindings.sh --ios
          scripts/sync/mobile-screen-bindings.sh --write --ios

      - name: Verify Swift 6 contracts and generic application build
        run: apps/ios/scripts/verify-ios-unified-routes.sh

