name: ci

permissions:
  contents: read

on:
  push:
    branches: [main, dev, test]
  pull_request:

jobs:
  test:
    name: rust baseline (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libssl-dev libfontconfig1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            pkg-config tmux

      - name: macOS tmux dependency
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null 2>&1 || brew install tmux

      - name: Verify generated design-token contract
        run: ./scripts/verify-design-tokens.sh --all-ui --no-new-baseline

      - name: Verify localization contract and copy policy
        run: ./scripts/verify-localization.sh --locales en-US,en-XA,ar-XB --no-new-baseline

      - name: Verify fail-closed release contract
        run: ./scripts/verify-release-workflow.sh

      - name: Verify Rust workspace
        env:
          TERMIRUST_CLIPPY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/verify-rust.sh workspace

      - name: Repeat local tmux regression
        run: ./scripts/repeat-test.sh 25 local::tests::local_tmux_session_survives_disconnect_and_reattaches

      - name: Repeat canvas tmux capability regression
        run: ./scripts/repeat-test.sh 25 ui::app::tests::canvas_persistent_local_terminal_opens_or_explains_missing_tmux

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libssl-dev libfontconfig1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            pkg-config

      - name: Check minimum supported Rust version
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

  windows:
    name: windows runtime and sidecars
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Compile and test Windows workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build required Windows release executables
        run: >-
          cargo build --release --locked
          -p termirust
          -p termirust-cli
          -p termirust-session-host
          -p termirust-mcp
          -p termirust-relay-server

      - name: Verify required Windows release executables
        shell: pwsh
        run: |
          $required = @(
            "termirust.exe",
            "termirust-cli.exe",
            "termirust-session-host.exe",
            "termirust-mcp.exe",
            "termirust-mcp-authorize.exe",
            "termirust-relay.exe"
          )
          foreach ($name in $required) {
            $path = Join-Path "target/release" $name
            if (-not (Test-Path -PathType Leaf $path)) {
              throw "required Windows release executable is missing: $path"
            }
          }

  android:
    name: native Android application
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Kotlin contracts, unit tests, lint, and debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          mobile/android/scripts/verify-android-unified-routes.sh
          mobile/android/gradlew -p mobile/android lintDebug --console=plain

  ios:
    name: native iOS and iPadOS application
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Swift 6 contracts and generic application build
        run: mobile/ios/scripts/verify-ios-unified-routes.sh
