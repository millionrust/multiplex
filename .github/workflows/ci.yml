name: ci

permissions:
  contents: read

on:
  push:
    branches: [main, dev, test]
  pull_request:
  # Run by hand with `debug` on to be handed a shell on each runner, from the moment it starts.
  # Meant for a failure that cannot be read from a log: a linker that will not say which symbol it
  # wanted, a build script that panics inside a dependency, a toolchain unlike every machine here.
  # The session is detached, so a job that nobody connects to runs and finishes as it always does.
  workflow_dispatch:
    inputs:
      debug:
        description: "Open a shell on each runner for the length of the job"
        type: boolean
        default: false
      # A command run on the Windows test machine with the test job's build, for a question the
      # whole suite answers too slowly, such as whether a few tests behave differently under one
      # runner than another. Example:
      # `cargo test -p multiplex-browser --lib --all-features --locked`. Empty, as on every push,
      # and the job does not run.
      windows_probe:
        description: "Command to run on Windows, e.g. cargo test -p multiplex-browser --lib --all-features --locked"
        type: string
        default: ""

jobs:
  test:
    name: rust baseline (${{ matrix.runner }})
    # A probe run asks one narrow question and should not also occupy every runner for an hour.
    # `inputs` is absent on a push, where this reads as empty and the job runs as it always has.
    if: inputs.windows_probe == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is deprecated and carries an Xcode far behind the one the iOS job builds
        # against; both macOS jobs now test the toolchain the applications are actually built on.
        runner: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detached, and before anything is built: the connection string is only readable in a live
      # log, so opening the session at the end of a failing job means racing it. This one is there
      # from the start and the job carries on around it, so the build can be watched as it runs.
      - name: Shell on the runner, from the start
        id: shell
        if: inputs.debug
        # The session only exists once tmate reaches its relay, and a runner that cannot get there
        # waits for it silently: every job on the last attempt sat in this step until it was
        # cancelled, holding a runner for a shell that never opened. Bounded, and never the reason
        # a job fails, so an unreachable relay costs three minutes rather than the whole run.
        timeout-minutes: 3
        continue-on-error: true
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: true

      # A running job's log cannot be read through the API, so the address is published as an
      # annotation as well, which can. Whoever asked for the shell can then pick it up without
      # watching a browser for the moment it appears.
      - name: Publish the shell address
        if: inputs.debug
        run: |
          echo "::notice title=Runner shell (${{ matrix.runner }})::${{ steps.shell.outputs.ssh-command }}"
          echo "${{ steps.shell.outputs.ssh-command }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # CI has been red, and rust-cache saves nothing from a failed job by default, so every
          # run rebuilt the whole workspace from scratch.
          cache-on-failure: true

      # The MCP, browser and diagnostics gates search with ripgrep, which the runners lack.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8,ripgrep

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libfontconfig1-dev libdbus-1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pkg-config tmux

      - name: macOS tmux dependency
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null 2>&1 || brew install tmux

      - name: Verify generated design-token contract
        run: ./scripts/verify/design-tokens.sh --all-ui --no-new-baseline

      - name: Verify localization contract and copy policy
        run: ./scripts/verify/localization.sh --locales en-US,en-XA,ar-XB --no-new-baseline

      - name: Verify fail-closed release contract
        run: ./scripts/verify/release-workflow.sh

      # Ubuntu 23.10 and newer refuse unprivileged user namespaces to unconfined programs, which
      # is exactly what Chromium's sandbox needs to start; without this the live browser capture
      # never loads a page and the test only sees a timeout. This lets Chromium's own sandbox
      # work rather than turning it off — scripts/verify/browser-capability.sh fails the build if
      # --no-sandbox ever appears in the crates, and that stays true.
      - name: Let Chromium's sandbox start on this runner
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify Rust workspace
        env:
          TERMIRUST_CLIPPY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/verify/rust.sh workspace

      # tmux changes what it accepts between releases: 3.2a has no copy-mode position counter and
      # rewrites `:` and `.` in session names, so a setup that works on the newest tmux can still
      # break the one an LTS ships. Both ends are built here rather than taken from the image,
      # which ships neither: 22.04 gave us 3.2a for free, and this runner had to move to 24.04
      # because PipeWire 0.3.48 declares a format modifier signed where libspa expects it
      # unsigned, so the Linux capture backend cannot compile there at all.
      - name: Build the tmux versions to test against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libevent-dev libncurses-dev bison
          for version in 3.2a 3.5a; do
            curl -fsSL -o "/tmp/tmux-$version.tar.gz" \
              "https://github.com/tmux/tmux/releases/download/$version/tmux-$version.tar.gz"
            tar -xzf "/tmp/tmux-$version.tar.gz" -C /tmp
            (cd "/tmp/tmux-$version" \
              && ./configure --prefix="/opt/tmux-$version" >/dev/null \
              && make -j"$(nproc)" >/dev/null \
              && sudo make install >/dev/null)
          done

      - name: Behaviour across tmux versions
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            ./scripts/test/tmux-matrix.sh \
              /opt/tmux-3.2a/bin/tmux /usr/bin/tmux /opt/tmux-3.5a/bin/tmux
          else
            ./scripts/test/tmux-matrix.sh
          fi


      - name: Repeat local tmux regression
        run: ./scripts/test/repeat.sh 25 local::tests::local_tmux_session_survives_disconnect_and_reattaches

      - name: Repeat canvas tmux capability regression
        run: ./scripts/test/repeat.sh 25 ui::app::tests::canvas_persistent_local_terminal_opens_or_explains_missing_tmux

  msrv:
    name: Rust 1.88 MSRV
    if: inputs.windows_probe == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          # CI has been red, and rust-cache saves nothing from a failed job by default, so every
          # run rebuilt the whole workspace from scratch.
          cache-on-failure: true

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libfontconfig1-dev libdbus-1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pkg-config

      - name: Check minimum supported Rust version
        # multiplex-screen-transport is excluded from the all-features pass and checked on its
        # own below: its `iroh` feature is the Stage B QUIC route, off by default, and the QUIC
        # stack it pulls in needs Rust 1.91. The crate itself, as it ships, builds at the MSRV.
        run: |
          cargo +1.88.0 check --workspace --exclude multiplex-slate \
            --exclude multiplex-screen-transport --all-targets --all-features --locked
          cargo +1.88.0 check -p multiplex-screen-transport --all-targets --locked

  # Split three ways, because the Windows suite spends almost all of its time running tests one
  # binary at a time: measured on 355cc81, twelve minutes compiling from a warm cache, then
  # fifty-four running 178 test binaries in sequence on a four-core machine. nextest runs every
  # binary's tests at once and hands each shard a third of them; each shard repeats the cached
  # compile, which is the price of the split and cheap next to what it saves.
  windows:
    name: windows runtime and sidecars (${{ matrix.shard }}/3)
    if: inputs.windows_probe == ''
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # LLVM's lld, which ships with the toolchain, in place of MSVC's link.exe: every run links
      # 178 test executables, and link.exe is the slow step in each. The release job keeps link.exe,
      # since what it builds is what ships.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
      # rust-cache keeps dependencies but not this workspace's own crates, which cargo rebuilds on
      # every checkout because checkout gives every source file a new timestamp. sccache keys each
      # compile by its contents instead, so a crate nobody touched is fetched rather than rebuilt
      # and nothing stale can come back. It cannot cache the test executables, only the libraries
      # under them. (Restoring timestamps from git history would skip more, but hands back stale
      # builds whenever a commit is older than the cache, so it is not used.)
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      # Defender scans every file the build writes and every test binary the first time it runs.
      # Measured on this runner: a test binary with no tests in it took seven seconds to start,
      # 178 of them run one after another, and the suites that read and write many files ran ten to
      # twenty times slower than on macOS. The runner is discarded when the job ends, so real-time
      # scanning of our own build output protects nothing here; what is tested is unchanged.
      - name: Keep Defender off the build output
        shell: pwsh
        run: >-
          Add-MpPreference -ExclusionPath
          $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP,
          "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # CI has been red, and rust-cache saves nothing from a failed job by default, so every
          # run rebuilt the whole workspace from scratch.
          cache-on-failure: true
          # The three shards build the same thing, so they share one cache, and one of them saves
          # it rather than all three writing the same gigabytes.
          shared-key: windows-test
          save-if: ${{ matrix.shard == 1 }}

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: mozilla-actions/sccache-action@v0.0.9

      # Every feature, deliberately: Windows is where an optional dependency is likeliest to break,
      # and the release contract in scripts/verify/release-workflow.sh holds this job to it.
      #
      # This and the bench step below are `cargo test --all-targets` split in two. nextest cannot
      # run a bench whose harness prints its own report, so it takes every other kind of target and
      # the benches run under cargo test. What each test assumes about sharing a process with
      # others is in .config/nextest.toml.
      - name: Compile and test Windows workspace
        run: >-
          cargo nextest run --workspace --lib --bins --tests --examples --all-features --locked
          --no-fail-fast --partition count:${{ matrix.shard }}/3

      # Once rather than three times: the benches are not split, so every shard would run all of
      # them. `--bench '*'` and not `--benches`: to cargo, `--benches` means every target with
      # `bench = true`, which libraries and binaries have by default, so it quietly ran nearly the
      # whole unit-test suite a second time, one binary after another, for thirty-six minutes.
      - name: Run the benches as tests
        if: matrix.shard == 1
        run: cargo test --workspace --bench '*' --all-features --locked --no-fail-fast

      # Whether sccache earned its place: how many compiles it served, missed, or could not cache.
      - name: Compile cache report
        if: always()
        run: sccache --show-stats

  # A slice of the Windows suite, run by hand, for questions the full job answers too slowly to be
  # worth asking. It never runs on a push: `windows_probe` is empty there, and an empty argument
  # list would otherwise mean "the whole workspace", which is the job above.
  windows-probe:
    name: windows probe
    if: inputs.windows_probe != ''
    runs-on: windows-2022
    timeout-minutes: 120
    # The test job's build, exactly, so a probe compiles from its warm cache and what it measures is
    # the machine the tests run on, not a different build of them.
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      # As in the full Windows job, and needed here too so a probe measures the same machine.
      - name: Keep Defender off the build output
        shell: pwsh
        run: >-
          Add-MpPreference -ExclusionPath
          $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP,
          "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          # The test job's cache, restored and never saved over: a probe's build is a slice of
          # that one and would only replace it with less.
          shared-key: windows-test
          save-if: false

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Run the chosen command
        # A whole command rather than arguments to one, so a single probe can compare runners,
        # e.g. the same tests under cargo test and then under nextest. Through the environment
        # rather than into the script text; only people who can dispatch this workflow choose it.
        shell: bash
        env:
          PROBE: ${{ inputs.windows_probe }}
        # Also to a file that is uploaded whatever happens: a job cancelled at its time limit
        # can lose its log entirely, and a long probe is the kind that reaches the limit.
        run: eval "$PROBE" 2>&1 | tee "$RUNNER_TEMP/probe.log"

      - name: Keep the probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-probe-log
          path: ${{ runner.temp }}/probe.log
          if-no-files-found: ignore

      # What the tests left running, newest first. Sorting by CPU, as this once did, hides a
      # process that is idle but still holding something, which is the kind worth finding. The
      # runner only clears orphans when the job ends, so this is the one place to see them.
      - name: Processes the tests left behind
        if: always()
        shell: pwsh
        run: |
          Get-Process | Sort-Object StartTime -Descending -ErrorAction SilentlyContinue |
            Select-Object -First 30 Name, Id, CPU, StartTime |
            Format-Table -AutoSize | Out-String -Width 200

  # The release binaries do not depend on the tests passing, and waiting for them put an hour
  # between a push and knowing whether Windows can still produce what it ships.
  windows-release:
    name: windows release executables
    if: inputs.windows_probe == ''
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build required Windows release executables
        run: >-
          cargo build --release --locked
          -p multiplex
          -p multiplex-cli
          -p multiplex-session-host
          -p multiplex-mcp
          -p multiplex-relay-server

      - name: Verify required Windows release executables
        shell: pwsh
        run: |
          $required = @(
            "multiplex.exe",
            "multiplex-cli.exe",
            "multiplex-session-host.exe",
            "multiplex-mcp.exe",
            "multiplex-mcp-authorize.exe",
            "multiplex-relay.exe"
          )
          foreach ($name in $required) {
            $path = Join-Path "target/release" $name
            if (-not (Test-Path -PathType Leaf $path)) {
              throw "required Windows release executable is missing: $path"
            }
          }

  android:
    name: native Android application
    if: inputs.windows_probe == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Shell on the runner, from the start
        id: shell
        if: inputs.debug
        # The session only exists once tmate reaches its relay, and a runner that cannot get there
        # waits for it silently: every job on the last attempt sat in this step until it was
        # cancelled, holding a runner for a shell that never opened. Bounded, and never the reason
        # a job fails, so an unreachable relay costs three minutes rather than the whole run.
        timeout-minutes: 3
        continue-on-error: true
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: true

      - name: Publish the shell address
        if: inputs.debug
        run: |
          echo "::notice title=Runner shell (Android)::${{ steps.shell.outputs.ssh-command }}"
          echo "${{ steps.shell.outputs.ssh-command }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The four Android ABIs the bindings are built for. A developer's machine usually has them
      # already, which is why their absence here only shows up as a compile that cannot find core.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          # CI has been red, and rust-cache saves nothing from a failed job by default, so every
          # run rebuilt the whole workspace from scratch.
          cache-on-failure: true

      # The Kotlin conformance tests call the generated bindings through JNA on the build
      # machine, so they need the host build of the library the APK packages for each ABI.
      - name: Build Controller bindings for Kotlin unit tests
        run: |
          cargo build --locked --release -p multiplex-controller-bindings --lib
          mkdir -p apps/android/app/src/test/native/linux-x86-64
          cp target/release/libtermirust_controller_bindings.so apps/android/app/src/test/native/linux-x86-64/

      # The Remote Screens bindings are generated rather than vendored, and the Kotlin sources
      # name their types, so `compileDebugKotlin` needs them before anything else runs.
      - name: Build and sync Remote Screens bindings
        # A hosted runner does not get to choose its NDK, and these bindings are built to prove the
        # application compiles and its tests pass, not to be released. Release artifacts are built
        # on the pinned toolchains, where this variable is unset.
        env:
          TERMIRUST_SCREEN_BINDINGS_ALLOW_UNPINNED: "1"
        run: |
          scripts/build/mobile-screen-bindings.sh --android
          scripts/sync/mobile-screen-bindings.sh --write --android

      - name: Verify Kotlin contracts, unit tests, lint, and debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          apps/android/scripts/verify-android-unified-routes.sh
          apps/android/gradlew -p apps/android lintDebug --console=plain


  ios:
    name: native iOS and iPadOS application
    if: inputs.windows_probe == ''
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Shell on the runner, from the start
        id: shell
        if: inputs.debug
        # The session only exists once tmate reaches its relay, and a runner that cannot get there
        # waits for it silently: every job on the last attempt sat in this step until it was
        # cancelled, holding a runner for a shell that never opened. Bounded, and never the reason
        # a job fails, so an unreachable relay costs three minutes rather than the whole run.
        timeout-minutes: 3
        continue-on-error: true
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: true

      - name: Publish the shell address
        if: inputs.debug
        run: |
          echo "::notice title=Runner shell (iOS)::${{ steps.shell.outputs.ssh-command }}"
          echo "${{ steps.shell.outputs.ssh-command }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The Xcode project lists the generated Remote Screens bindings among its sources, and they
      # are generated rather than vendored, so the project cannot even be generated without them.
      - name: Build and sync Remote Screens bindings
        # As on Android: the runner's Xcode is whatever the image ships, and what is built here is
        # verified, not shipped.
        env:
          TERMIRUST_SCREEN_BINDINGS_ALLOW_UNPINNED: "1"
        run: |
          scripts/build/mobile-screen-bindings.sh --ios
          scripts/sync/mobile-screen-bindings.sh --write --ios

      - name: Verify Swift 6 contracts and generic application build
        run: apps/ios/scripts/verify-ios-unified-routes.sh

