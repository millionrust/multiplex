# cargo-nextest configuration.
#
# nextest gives every test a process of its own and runs tests from every binary at once, where
# `cargo test` runs one binary at a time with all of its tests in one process. Anything a test
# assumed about sharing a process with its neighbours is stated here rather than left to luck.

[test-groups]
# The CLI's integration tests start real durable Hosts, all for the one session id in
# tests/common/mod.rs. On Linux and macOS a Host's socket lives in a machine-wide directory,
# /tmp/termirust-<uid>/<session id> (see termirust-client's ipc.rs), because a Unix socket path
# cannot be long enough to sit under a test's own temporary directory. Two of these tests running
# at once therefore meet at the same socket, one test's client reaches the other's Host, and that
# Host refuses it as PermissionDenied. Inside one binary a process-wide lock keeps them apart;
# across binaries only this can. Windows keeps each runtime under the test's own config root, so
# there it costs a little time and changes nothing.
durable-host-session = { max-threads = 1 }

# The desktop application's tests take TestIsolation, a process-wide lock held for the whole test,
# so under `cargo test` - one process for the binary - they have always run one at a time. nextest
# gives each its own process and that lock orders nothing, so several now started local shells and
# typed into them at once. On the Windows runner that lost the typed input: the shell printed its
# prompt and then saw nothing for ten seconds, several tests at a time, while tests in every other
# binary kept passing around them. Run these one at a time, as they always were; the rest of the
# workspace still runs in parallel beside them.
desktop-isolation = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(termirust-cli) and kind(test)'
test-group = 'durable-host-session'

[[profile.default.overrides]]
filter = 'binary_id(termirust::bin/termirust)'
test-group = 'desktop-isolation'
