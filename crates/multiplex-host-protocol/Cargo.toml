[package]
name = "multiplex-host-protocol"
version = "0.0.2"
edition = "2024"
rust-version.workspace = true
description = "Versioned bounded wire protocol for TermiRust session Hosts"
license = "MIT OR Apache-2.0"

[dependencies]
crc32c = "0.6"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
multiplex-domain = { version = "0.0.2", path = "../multiplex-domain" }
uuid = "1.22"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dev-dependencies]
proptest = "1.9"
serde_json = "1.0"
