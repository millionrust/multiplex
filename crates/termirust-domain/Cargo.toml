[package]
name = "termirust-domain"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Pure domain contracts for TermiRust projects and durable sessions"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.22", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27"
