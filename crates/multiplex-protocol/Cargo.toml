[package]
name = "multiplex-protocol"
version = "0.0.20"
edition = "2024"
rust-version.workspace = true
description = "Shared TermiRust mobile vault and protocol schema"
license = "MIT"

[dependencies]
aes-gcm-siv = "0.11"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
