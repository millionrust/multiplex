[package]
name = "termirust-replication-bindings"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Native secure-store boundary for TermiRust replication"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
fs2 = "0.4"
libc = "0.2"
termirust-domain = { version = "0.1.0", path = "../termirust-domain" }
termirust-protocol = { version = "0.1.0", path = "../termirust-protocol" }
termirust-store = { version = "0.1.0", path = "../termirust-store" }
termirust-replication-security = { version = "0.1.0", path = "../termirust-replication-security" }
uniffi = { version = "=0.32.0", default-features = false }
zeroize = "=1.8.2"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27"
