[package]
name = "multiplex-relay-server"
version = "0.0.5"
edition = "2024"
rust-version.workspace = true
description = "Authenticated local-loopback ciphertext relay server core"
license = "MIT OR Apache-2.0"

[[bin]]
name = "multiplex-relay"
path = "src/main.rs"

[dependencies]
multiplex-env = { version = "0.0.5", path = "../multiplex-env" }
futures-util = { version = "=0.3.32", features = ["sink"] }
base64 = "=0.22.1"
fs2 = "=0.4.3"
libc = "=0.2.183"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
multiplex-relay-protocol = { version = "0.0.5", path = "../multiplex-relay-protocol" }
tokio = { version = "=1.50.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
zeroize = "=1.9.0"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile = "=3.27.0"
multiplex-controller-security = { version = "0.0.5", path = "../multiplex-controller-security" }
