[package]
name = "termirust-diagnostics"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Bounded, redacted local diagnostics for TermiRust"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27"
