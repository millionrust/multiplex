[package]
name = "multiplex-screen-input"
version = "0.0.4"
edition = "2024"
rust-version.workspace = true
description = "Pointer and keyboard injection for TermiRust Remote Screens: a single-writer injector over a platform-neutral sink, and the macOS Core Graphics backend"
license = "MIT OR Apache-2.0"

[dependencies]
multiplex-screen-codec = { version = "0.0.4", path = "../multiplex-screen-codec" }
multiplex-screen-protocol = { version = "0.0.4", path = "../multiplex-screen-protocol" }
multiplex-screen-session = { version = "0.0.4", path = "../multiplex-screen-session" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
