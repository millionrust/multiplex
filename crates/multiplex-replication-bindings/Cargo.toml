[package]
name = "multiplex-replication-bindings"
version = "0.0.2"
edition = "2024"
rust-version.workspace = true
description = "Native secure-store boundary for TermiRust replication"
license = "MIT OR Apache-2.0"

[lib]
# The name the phone apps load, and the one uniffi writes into its bindings. It stays as it
# was while the crate around it is renamed: what an installed app looks for belongs with the
# rest of the app-facing identity, in the OS registration step of the rename.
name = "multiplex_replication_bindings"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
fs2 = "0.4"
libc = "0.2"
multiplex-domain = { version = "0.0.2", path = "../multiplex-domain" }
multiplex-protocol = { version = "0.0.2", path = "../multiplex-protocol" }
multiplex-store = { version = "0.0.2", path = "../multiplex-store" }
multiplex-replication-security = { version = "0.0.2", path = "../multiplex-replication-security" }
uniffi = { version = "=0.32.0", default-features = false }
zeroize = "=1.9.0"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27"
