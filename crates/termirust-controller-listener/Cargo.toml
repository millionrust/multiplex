[package]
name = "termirust-controller-listener"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Bounded exact-interface LAN/VPN Controller listener for TermiRust"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
if-addrs = "=0.15.0"
mdns-sd = { version = "=0.21.3", default-features = false }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
termirust-client = { version = "0.1.0", path = "../termirust-client" }
termirust-controller-security = { version = "0.1.0", path = "../termirust-controller-security" }
termirust-domain = { version = "0.1.0", path = "../termirust-domain" }
termirust-host-protocol = { version = "0.1.0", path = "../termirust-host-protocol" }
termirust-session-host = { version = "0.1.0", path = "../termirust-session-host" }
termirust-store = { version = "0.1.0", path = "../termirust-store" }
termirust-tmux = { version = "0.1.0", path = "../termirust-tmux" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.22", features = ["serde", "v4"] }
zeroize = "=1.9.0"
libc = "0.2"

[dev-dependencies]
proptest = "=1.11.0"
# The mobile fixture serves a synthetic screen, so a phone can be tested against a real host.
# A development-only cycle: the screen host is built on this crate.
termirust-screen-codec = { version = "0.1.0", path = "../termirust-screen-codec" }
termirust-screen-host = { version = "0.1.0", path = "../termirust-screen-host" }
termirust-screen-protocol = { version = "0.1.0", path = "../termirust-screen-protocol" }
termirust-screen-session = { version = "0.1.0", path = "../termirust-screen-session" }
tempfile = "3.27"
tokio = { version = "1", features = ["test-util"] }
