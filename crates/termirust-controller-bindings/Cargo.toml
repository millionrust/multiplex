[package]
name = "termirust-controller-bindings"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Generated Swift and Kotlin boundary for TermiRust Controller-v1 security"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
bindgen-cli = ["uniffi/cargo-metadata", "uniffi/cli"]

[dependencies]
termirust-controller-security = { version = "0.1.0", path = "../termirust-controller-security" }
uniffi = { version = "=0.32.0", default-features = false }
zeroize = "=1.8.2"

[dev-dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]
