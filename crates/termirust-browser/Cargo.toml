[package]
name = "termirust-browser"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Isolated, policy-bound browser runtime for TermiRust"
license = "MIT OR Apache-2.0"

[dependencies]
chromiumoxide = { version = "0.9.1", default-features = false }
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.27"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
url = "2.5"

[dev-dependencies]
serde_json = "1.0"
