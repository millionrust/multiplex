[package]
name = "termirust-replication-security"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Authenticated record sealing for TermiRust local-first replication"
license = "MIT OR Apache-2.0"

[dependencies]
aes-gcm-siv = "=0.11.1"
hkdf = "=0.12.4"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
termirust-domain = { version = "0.1.0", path = "../termirust-domain" }
zeroize = { version = "=1.8.2", features = ["zeroize_derive"] }

[dev-dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
