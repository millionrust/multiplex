[package]
name = "termirust-screen-host"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Serves TermiRust Remote Screens over the Controller channel: the screen session the listener carries, fed by captured frames and answered with tile batches"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
termirust-controller-listener = { version = "0.1.0", path = "../termirust-controller-listener" }
termirust-screen-codec = { version = "0.1.0", path = "../termirust-screen-codec" }
termirust-screen-protocol = { version = "0.1.0", path = "../termirust-screen-protocol" }
termirust-screen-session = { version = "0.1.0", path = "../termirust-screen-session" }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
termirust-screen-video = { version = "0.1.0", path = "../termirust-screen-video" }

[dev-dependencies]
termirust-controller-security = { version = "0.1.0", path = "../termirust-controller-security" }
termirust-domain = { version = "0.1.0", path = "../termirust-domain" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
