[package]
name = "termirust-relay-server"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Authenticated local-loopback ciphertext relay server core"
license = "MIT OR Apache-2.0"

[dependencies]
futures-util = { version = "=0.3.32", features = ["sink"] }
fs2 = "=0.4.3"
libc = "=0.2.183"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
termirust-relay-protocol = { version = "0.1.0", path = "../termirust-relay-protocol" }
tokio = { version = "=1.50.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile = "=3.27.0"
termirust-controller-security = { version = "0.1.0", path = "../termirust-controller-security" }
