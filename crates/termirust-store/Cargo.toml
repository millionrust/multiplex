[package]
name = "termirust-store"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Versioned atomic local metadata stores for TermiRust"
license = "MIT OR Apache-2.0"

[features]
default = []
os-keyring = ["termirust-replication-security/os-keyring"]

[dependencies]
crc32c = "0.6"
fs2 = "0.4"
libc = "0.2"
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
termirust-domain = { version = "0.1.0", path = "../termirust-domain" }
termirust-replication-security = { version = "0.1.0", path = "../termirust-replication-security" }
uuid = { version = "1.22", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
zeroize = "=1.8.2"

[[bench]]
name = "artifact_ingest"
harness = false
