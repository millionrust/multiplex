[package]
name = "termirust-controller-security"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "In-memory Controller-v1 pairing and authenticated framing reference"
license = "MIT OR Apache-2.0"

[dependencies]
clatter = { version = "=2.2.0", default-features = false, features = ["alloc", "use-25519", "use-chacha20poly1305", "use-blake2"] }
hkdf = "=0.12.4"
rand_core = "=0.6.4"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = { version = "=1.8.2", features = ["zeroize_derive"] }

[dev-dependencies]
hex = "=0.4.3"
proptest = "=1.11.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
