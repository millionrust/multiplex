[package]
name = "multiplex-screen-codec"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Platform-free tile codec for TermiRust Remote Screens: damage, classification, lossless and lossy tiles, caching, and the bounded wire format"
license = "MIT OR Apache-2.0"

[dependencies]
miniz_oxide = "0.8.9"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

[dev-dependencies]
proptest = "1.11"
