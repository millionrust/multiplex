[package]
name = "termirust-client"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Conforming local client for TermiRust session Hosts"
license = "MIT OR Apache-2.0"

[dependencies]
crc32c = "0.6"
libc = "0.2"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
termirust-domain = { version = "0.1.0", path = "../termirust-domain" }
termirust-host-protocol = { version = "0.1.0", path = "../termirust-host-protocol" }
termirust-store = { version = "0.1.0", path = "../termirust-store" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.22", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
termirust-session-host = { version = "0.1.0", path = "../termirust-session-host" }
