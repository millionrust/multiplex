[package]
name = "multiplex-session-host"
version = "0.0.2"
edition = "2024"
rust-version.workspace = true
description = "One-session durable PTY Host for TermiRust"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false }
crc32c = "0.6"
libc = "0.2"
portable-pty = "0.9"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
multiplex-domain = { version = "0.0.2", path = "../multiplex-domain" }
multiplex-host-protocol = { version = "0.0.2", path = "../multiplex-host-protocol" }
multiplex-store = { version = "0.0.2", path = "../multiplex-store" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27"
multiplex-client = { version = "0.0.2", path = "../multiplex-client" }
multiplex-controller-listener = { version = "0.0.2", path = "../multiplex-controller-listener" }
uuid = "1.22"
