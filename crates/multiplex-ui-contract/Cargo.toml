[package]
name = "multiplex-ui-contract"
version = "0.0.2"
edition = "2024"
rust-version.workspace = true
description = "Generated semantic design-token contract for TermiRust interfaces"
license = "MIT OR Apache-2.0"

[dependencies]
multiplex-env = { version = "0.0.2", path = "../multiplex-env" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"

[[bin]]
name = "generate-tokens"
path = "src/bin/generate_tokens.rs"

[[bin]]
name = "verify-design-tokens"
path = "src/bin/verify_design_tokens.rs"

[[bin]]
name = "generate-messages"
path = "src/bin/generate_messages.rs"

[[bin]]
name = "verify-localization"
path = "src/bin/verify_localization.rs"

[[bin]]
name = "bench-terminal-accessibility"
path = "src/bin/bench_terminal_accessibility.rs"

[[bin]]
name = "ui-audit"
path = "src/bin/ui_audit.rs"
