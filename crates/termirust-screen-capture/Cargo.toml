[package]
name = "termirust-screen-capture"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Display capture with damage for TermiRust Remote Screens: a platform-neutral source trait, a replay source, and the macOS ScreenCaptureKit backend"
license = "MIT OR Apache-2.0"

[dependencies]
termirust-screen-codec = { version = "0.1.0", path = "../termirust-screen-codec" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
screencapturekit = { version = "=10.0.3", default-features = false }
