[package]
name = "multiplex-mobile-ffi"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "C ABI bridge for TermiRust mobile vault crypto"
license = "MIT OR Apache-2.0"

[lib]
# The name the phone apps load, and the one uniffi writes into its bindings. It stays as it
# was while the crate around it is renamed: what an installed app looks for belongs with the
# rest of the app-facing identity, in the OS registration step of the rename.
name = "termirust_mobile_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
multiplex-protocol = { version = "0.1.0", path = "../multiplex-protocol" }
multiplex-relay-protocol = { version = "0.1.0", path = "../multiplex-relay-protocol" }
vt100 = "0.16"
