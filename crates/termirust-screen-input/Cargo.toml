[package]
name = "termirust-screen-input"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Pointer and keyboard injection for TermiRust Remote Screens: a single-writer injector over a platform-neutral sink, and the macOS Core Graphics backend"
license = "MIT OR Apache-2.0"

[dependencies]
termirust-screen-codec = { version = "0.1.0", path = "../termirust-screen-codec" }
termirust-screen-protocol = { version = "0.1.0", path = "../termirust-screen-protocol" }
termirust-screen-session = { version = "0.1.0", path = "../termirust-screen-session" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
