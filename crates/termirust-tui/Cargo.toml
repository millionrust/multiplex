[package]
name = "termirust-tui"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Terminal fleet navigator and durable session client for TermiRust"
license = "MIT OR Apache-2.0"

[dependencies]
dirs = "=6.0.0"
rand = "0.8"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
signal-hook = "=0.3.18"
termirust-client = { version = "0.1.0", path = "../termirust-client" }
termirust-domain = { version = "0.1.0", path = "../termirust-domain" }
termirust-host-protocol = { version = "0.1.0", path = "../termirust-host-protocol" }
termirust-store = { version = "0.1.0", path = "../termirust-store" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
vt100 = "=0.16.2"

[dev-dependencies]
libc = "=0.2.183"
portable-pty = "=0.9.0"
tempfile = "=3.27.0"
termirust-session-host = { version = "0.1.0", path = "../termirust-session-host" }

[[bin]]
name = "termirust-tui"
path = "src/main.rs"
