[package]
name = "termirust"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Native desktop SSH client built with GPUI"
authors = ["TermiRust contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jacobsam/terminal"
readme = "../../README.md"
default-run = "termirust"

[package.metadata.bundle]
name = "TermiRust"
identifier = "com.termirust.desktop"
icon = ["assets/icons/app.png", "assets/icons/app@2x.png"]
copyright = "Copyright (c) 2025 TermiRust contributors"
category = "DeveloperTool"
short_description = "Native desktop SSH client"
long_description = """
TermiRust is a native desktop SSH client with vault management,
SFTP browsing, port forwarding, jump host chains, snippets,
broadcast input, and more.
"""
osx_minimum_system_version = "12.0"
osx_url_schemes = ["termirust"]
deb_depends = ["libssl3", "libxkbcommon0"]

[dependencies]
aes-gcm-siv = "0.11"
alacritty_terminal = { version = "0.26.0", default-features = false }
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false }
dirs = "6.0"
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
gpui-component = "0.5.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
libc = "0.2"
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
# russh 0.60's key types take an RNG through rand_core 0.10's traits, which rand 0.8's `OsRng`
# does not implement. Both are the operating system's source; only the trait shape differs. Kept
# under an alias and used only where russh needs it, rather than moving every call site.
ssh-rand = { package = "rand", version = "0.10" }
rfd = "0.15"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smallvec = "1.15"
termirust-protocol = { version = "0.1.0", path = "../termirust-protocol" }
termirust-domain = { version = "0.1.0", path = "../termirust-domain" }
termirust-diagnostics = { version = "0.1.0", path = "../termirust-diagnostics" }
termirust-client = { version = "0.1.0", path = "../termirust-client" }
termirust-cli = { version = "0.1.0", path = "../termirust-cli" }
termirust-controller-security = { version = "0.1.0", path = "../termirust-controller-security" }
termirust-controller-listener = { version = "0.1.0", path = "../termirust-controller-listener" }
termirust-host-protocol = { version = "0.1.0", path = "../termirust-host-protocol" }
termirust-relay-client = { version = "0.1.0", path = "../termirust-relay-client" }
termirust-screen-capture = { version = "0.1.0", path = "../termirust-screen-capture" }
termirust-screen-codec = { version = "0.1.0", path = "../termirust-screen-codec" }
termirust-screen-host = { version = "0.1.0", path = "../termirust-screen-host" }
termirust-screen-input = { version = "0.1.0", path = "../termirust-screen-input" }
termirust-screen-protocol = { version = "0.1.0", path = "../termirust-screen-protocol" }
termirust-screen-session = { version = "0.1.0", path = "../termirust-screen-session" }
termirust-session-host = { version = "0.1.0", path = "../termirust-session-host" }
termirust-store = { version = "0.1.0", path = "../termirust-store", features = ["os-keyring"] }
termirust-tmux = { version = "0.1.0", path = "../termirust-tmux" }
termirust-ui-contract = { version = "0.1.0", path = "../termirust-ui-contract" }
tokio = { version = "1", features = ["io-std", "io-util", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.22", features = ["v4"] }
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
objc = "0.2"
termirust-accessibility-macos = { version = "0.1.0", path = "../termirust-accessibility-macos" }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# 4.18 raises MSRV above the workspace contract; keep 4.17 pinned until N14
# qualification moves the whole workspace together.
notify-rust = { version = "=4.17.0" }

[dev-dependencies]
tempfile = "3.27"
unicode-width = "=0.2.2"
vt100 = "0.16.2"
