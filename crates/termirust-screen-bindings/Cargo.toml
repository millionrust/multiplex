[package]
name = "termirust-screen-bindings"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Generated Swift and Kotlin boundary for watching and driving TermiRust Remote Screens"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
bindgen-cli = ["uniffi/cargo-metadata", "uniffi/cli"]

[dependencies]
termirust-screen-codec = { version = "0.1.0", path = "../termirust-screen-codec" }
termirust-screen-protocol = { version = "0.1.0", path = "../termirust-screen-protocol" }
termirust-screen-session = { version = "0.1.0", path = "../termirust-screen-session" }
uniffi = { version = "=0.32.0", default-features = false }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]
