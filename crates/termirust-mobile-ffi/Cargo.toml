[package]
name = "termirust-mobile-ffi"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "C ABI bridge for TermiRust mobile vault crypto"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
termirust-protocol = { version = "0.1.0", path = "../termirust-protocol" }
termirust-relay-protocol = { version = "0.1.0", path = "../termirust-relay-protocol" }
vt100 = "0.16"
